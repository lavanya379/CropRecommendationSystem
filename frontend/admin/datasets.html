<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI Admin | Dataset Governance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar (Light Theme) -->
        <aside class="bg-white w-64 lg:w-72 flex-shrink-0 border-r border-slate-200/80 h-screen flex flex-col shadow-sm">
            <div class="h-20 flex items-center px-6 border-b border-slate-100 space-x-3">
                <div class="w-10 h-10 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-md shadow-emerald-600/20">
                    <i class="fas fa-shield-halved text-lg"></i>
                </div>
                <div>
                    <span class="font-extrabold text-xl text-slate-900 tracking-tight block">CropAI</span>
                    <span class="text-[10px] font-extrabold text-emerald-600 uppercase tracking-widest block">Admin Console</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto px-4 py-6 space-y-6">
                <div>
                    <div class="px-3 text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2">MANAGEMENT</div>
                    <div class="space-y-1">
                        <a href="dashboard.html" class="flex items-center px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100/80 hover:text-slate-900 transition">
                            <i class="fas fa-chart-pie w-5 mr-2.5 text-slate-400 text-sm"></i> System Overview
                        </a>
                        <a href="users.html" class="flex items-center px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100/80 hover:text-slate-900 transition">
                            <i class="fas fa-users w-5 mr-2.5 text-slate-400 text-sm"></i> User Governance
                        </a>
                    </div>
                </div>

                <div>
                    <div class="px-3 text-[10px] font-extrabold text-slate-400 uppercase tracking-widest mb-2">DATA & AI INTELLIGENCE</div>
                    <div class="space-y-1">
                        <a href="datasets.html" class="flex items-center px-3.5 py-2.5 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border-r-4 border-emerald-600 shadow-sm">
                            <i class="fas fa-database w-5 mr-2.5 text-emerald-600 text-sm"></i> Datasets Inventory
                        </a>
                        <a href="models.html" class="flex items-center px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100/80 hover:text-slate-900 transition">
                            <i class="fas fa-brain w-5 mr-2.5 text-slate-400 text-sm"></i> ML Models & Health
                        </a>
                        <a href="reports.html" class="flex items-center px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100/80 hover:text-slate-900 transition">
                            <i class="fas fa-file-contract w-5 mr-2.5 text-slate-400 text-sm"></i> System Audit Logs
                        </a>
                    </div>
                </div>
            </div>

            <div class="p-4 border-t border-slate-100 bg-slate-50/50">
                <button id="admin-logout" class="w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-bold text-rose-600 hover:bg-rose-50 rounded-xl transition">
                    <span class="flex items-center"><i class="fas fa-arrow-right-from-bracket mr-2"></i> Logout Admin</span>
                    <i class="fas fa-chevron-right text-[10px] text-rose-300"></i>
                </button>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto bg-slate-50 p-8 space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-900">Dataset Inventory & Ingestion</h1>
                    <p class="text-xs text-slate-500 mt-1 font-medium">Manage agricultural CSV datasets, mandi prices, soil chemistry & climate impact metrics</p>
                </div>
                <span class="px-3.5 py-1.5 bg-emerald-50 text-emerald-700 text-xs font-extrabold rounded-full border border-emerald-200">
                    <i class="fas fa-check-circle mr-1.5 text-emerald-600"></i> 4 Datasets Active (8,312 records)
                </span>
            </div>

            <!-- Datasets Grid -->
            <div id="datasets-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dynamically rendered -->
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '../login.html'; return; }

            try {
                const res = await fetch(`${API_BASE_URL}/admin/datasets`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (data.success) {
                    renderDatasets(data.datasets);
                }
            } catch (e) { console.error(e); }

            document.getElementById('admin-logout').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '../login.html';
            });
        });

        function renderDatasets(list) {
            const container = document.getElementById('datasets-grid');
            container.innerHTML = list.map(d => `
                <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4 hover:border-emerald-300 transition">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center font-bold">
                                <i class="fas fa-file-csv text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-extrabold text-base text-slate-900">${d.name}</h3>
                                <p class="text-xs text-slate-500">${d.description}</p>
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-2 py-3 border-y border-slate-100 text-xs text-center">
                        <div class="bg-slate-50 p-2.5 rounded-xl">
                            <span class="block text-[10px] text-slate-400 font-extrabold uppercase">Total Rows</span>
                            <span class="font-extrabold text-slate-900 text-sm">${d.rows.toLocaleString()}</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl">
                            <span class="block text-[10px] text-slate-400 font-extrabold uppercase">File Size</span>
                            <span class="font-extrabold text-emerald-600 text-sm">${d.size}</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-xl">
                            <span class="block text-[10px] text-slate-400 font-extrabold uppercase">Status</span>
                            <span class="font-extrabold text-blue-600 text-xs">${d.status}</span>
                        </div>
                    </div>
                    <div class="flex justify-between items-center text-xs pt-1">
                        <span class="text-slate-400 font-semibold"><i class="fas fa-database text-emerald-500 mr-1"></i> Primary Key Indexed</span>
                        <span class="px-2.5 py-1 bg-emerald-50 text-emerald-700 font-extrabold rounded-lg text-[10px] uppercase border border-emerald-200">Verified CSV</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
