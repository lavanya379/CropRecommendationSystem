<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex flex-col">
    
    <!-- Navbar (Simplified) -->
    <nav class="bg-white shadow-sm p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="flex items-center">
                <i class="fas fa-leaf text-green-600 text-2xl mr-2"></i>
                <span class="font-bold text-xl text-green-800 tracking-tight">CropAI</span>
            </a>
            <a href="register.html" class="text-green-600 font-medium hover:underline">Create an account</a>
        </div>
    </nav>

    <!-- Login Container -->
    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">
            <div class="bg-green-700 p-6 text-center">
                <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
                <p class="text-green-100 text-sm mt-1">Sign in to your farmer dashboard</p>
            </div>
            
            <div class="p-8">
                <!-- Error Alert -->
                <div id="error-msg" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-100 flex items-center">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="error-text">Invalid credentials.</span>
                </div>

                <!-- URL Param Alert (e.g., Session Expired) -->
                <div id="url-msg" class="hidden bg-yellow-50 text-yellow-700 p-3 rounded-lg text-sm mb-4 border border-yellow-100">
                </div>

                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" id="email" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="farmer@example.com">
                        </div>
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-sm font-medium text-gray-700">Password</label>
                            <a href="#" class="text-xs text-green-600 hover:underline">Forgot password?</a>
                        </div>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-lock text-gray-400"></i>
                            </div>
                            <input type="password" id="password" required class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 outline-none transition" placeholder="••••••••">
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 transition flex justify-center items-center">
                        <span>Sign In</span>
                        <i id="login-spinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                    </button>
                </form>

                <div class="mt-4 border-t pt-4">
                    <p class="text-xs text-center text-gray-500 mb-2 font-medium">Quick Demo Autofill:</p>
                    <div class="flex gap-2 text-xs justify-center">
                        <button type="button" onclick="document.getElementById('email').value='user@cropai.com';document.getElementById('password').value='Password123';" class="px-2.5 py-1 bg-green-50 text-green-700 rounded border border-green-200 hover:bg-green-100 font-medium">Demo Farmer</button>
                        <a href="admin/login.html?demo=true" class="px-2.5 py-1 bg-purple-50 text-purple-700 rounded border border-purple-200 hover:bg-purple-100 font-medium text-center">Demo Admin</a>
                    </div>
                </div>
                <div class="mt-3 text-center">
                    <a href="admin/login.html" class="text-xs text-gray-400 hover:text-gray-600 font-semibold"><i class="fas fa-shield-halved mr-1"></i> Admin Portal Login</a>
                </div>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
