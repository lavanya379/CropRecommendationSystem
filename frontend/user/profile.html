<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI | Farmer Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation Container -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto pt-16 lg:pt-0 lg:pl-72 bg-slate-50 custom-scrollbar">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                
                <!-- Header -->
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div class="flex items-center space-x-2 text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full w-max mb-2 border border-emerald-200">
                        <i class="fas fa-user-gear"></i>
                        <span>Farmer Account Settings</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Farmer Profile</h1>
                    <p class="text-slate-500 text-sm mt-1">Manage personal details, contact information, and default location parameters.</p>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 sm:p-8 space-y-6">
                    <div id="save-alert" class="hidden bg-emerald-50 text-emerald-800 p-4 rounded-2xl text-xs font-bold border border-emerald-200 flex items-center">
                        <i class="fas fa-check-circle mr-2 text-base text-emerald-600"></i> Profile updated successfully!
                    </div>

                    <form id="profile-form" class="space-y-6">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
                                <input type="text" id="prof-name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
                                <input type="email" id="prof-email" disabled class="w-full px-4 py-2.5 border border-slate-200 bg-slate-100 text-slate-400 font-bold rounded-xl text-sm outline-none cursor-not-allowed">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Mobile Number</label>
                                <input type="tel" id="prof-phone" placeholder="+91 98765 43210" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Preferred Language</label>
                                <select id="prof-lang" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <option value="English">English</option>
                                    <option value="Telugu">Telugu (తెలుగు)</option>
                                    <option value="Hindi">Hindi (हिंदी)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Home State</label>
                                <select id="prof-state" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                                    <option value="Telangana">Telangana</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 mb-1">Home District</label>
                                <input type="text" id="prof-district" placeholder="Nandyal" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex justify-end">
                            <button type="submit" id="save-btn" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-md transition">
                                Save Profile Changes
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <!-- Page Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initCropAINavigation('profile');
            if (!getToken()) { window.location.href = '../login.html'; return; }

            try {
                const res = await UserAPI.getProfile();
                if (res.success && res.user) {
                    const u = res.user;
                    document.getElementById('prof-name').value = u.name || '';
                    document.getElementById('prof-email').value = u.email || '';
                    document.getElementById('prof-phone').value = u.phone || '';
                    document.getElementById('prof-lang').value = u.preferred_language || 'English';
                    document.getElementById('prof-state').value = u.state || 'Andhra Pradesh';
                    document.getElementById('prof-district').value = u.district || '';
                }
            } catch (e) {
                console.error("Failed to load profile", e);
            }

            document.getElementById('profile-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    name: document.getElementById('prof-name').value.trim(),
                    phone: document.getElementById('prof-phone').value.trim(),
                    preferred_language: document.getElementById('prof-lang').value,
                    state: document.getElementById('prof-state').value,
                    district: document.getElementById('prof-district').value.trim()
                };
                const res = await UserAPI.updateProfile(payload);
                if (res.success) {
                    const alertBox = document.getElementById('save-alert');
                    alertBox.classList.remove('hidden');
                    setTimeout(() => alertBox.classList.add('hidden'), 3000);
                } else {
                    alert(res.message || 'Failed to update profile');
                }
            });
        });
    </script>
</body>
</html>
