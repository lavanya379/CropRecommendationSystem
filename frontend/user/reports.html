<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI | My Reports</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation Container -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto pt-16 lg:pt-0 lg:pl-72 bg-slate-50 custom-scrollbar">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                
                <!-- Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div>
                        <div class="flex items-center space-x-2 text-xs font-bold text-purple-700 bg-purple-50 px-3 py-1 rounded-full w-max mb-2 border border-purple-200">
                            <i class="fas fa-file-contract"></i>
                            <span>Saved Analysis Dossiers</span>
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">My Analysis Reports</h1>
                        <p class="text-slate-500 text-sm mt-1">Export, download, and print your ML recommendation dossiers.</p>
                    </div>

                    <a href="recommendation.html" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-extrabold shadow-md shadow-emerald-200 transition flex items-center">
                        <i class="fas fa-wand-magic-sparkles mr-2"></i> New Analysis
                    </a>
                </div>

                <!-- Reports Cards Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="reports-grid">
                    <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-200 text-slate-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p class="text-xs">Loading analysis reports...</p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Page Scripts -->
    <script src="../js/api.js?v=2.1"></script>
    <script src="../js/nav.js?v=2.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initCropAINavigation('reports');
            if (!getToken()) { window.location.href = '../login.html'; return; }

            loadReports();
        });

        async function loadReports() {
            const grid = document.getElementById('reports-grid');
            if (!grid) return;

            try {
                const res = await RecAPI.getHistory();
                if (res.success && res.recommendations && res.recommendations.length > 0) {
                    grid.innerHTML = res.recommendations.map(r => {
                        const scorePct = (parseFloat(r.model_confidence || 0) * (parseFloat(r.model_confidence || 0) <= 1 ? 100 : 1)).toFixed(1);
                        const rDate    = new Date(r.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

                        return `
                          <div class="bg-white rounded-3xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4">
                            <div>
                              <div class="flex items-start justify-between">
                                <div>
                                  <span class="text-[10px] font-extrabold uppercase text-purple-700 bg-purple-50 px-2.5 py-0.5 rounded-full border border-purple-200">AI Report</span>
                                  <h3 class="text-xl font-extrabold text-slate-900 capitalize mt-1">${r.recommended_crop} Analysis</h3>
                                  <p class="text-xs text-slate-400 font-medium mt-0.5"><i class="fas fa-seedling mr-1 text-emerald-600"></i>${r.farm_name || 'Primary Plot'}</p>
                                </div>
                                <div class="w-10 h-10 bg-purple-50 text-purple-700 rounded-2xl flex items-center justify-center font-bold">
                                  <i class="fas fa-file-contract"></i>
                                </div>
                              </div>

                              <div class="grid grid-cols-2 gap-3 mt-4 text-xs">
                                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                  <span class="text-[10px] text-slate-400 font-bold uppercase">Confidence</span>
                                  <p class="font-extrabold text-emerald-700 mt-0.5">${scorePct}%</p>
                                </div>
                                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                  <span class="text-[10px] text-slate-400 font-bold uppercase">Analysis Date</span>
                                  <p class="font-extrabold text-slate-900 mt-0.5 truncate">${rDate}</p>
                                </div>
                                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                  <span class="text-[10px] text-slate-400 font-bold uppercase">Engine</span>
                                  <p class="font-extrabold text-slate-800 mt-0.5 font-mono text-[10px]">ensemble-v2.0</p>
                                </div>
                                <div class="p-3 bg-slate-50 rounded-2xl border border-slate-100">
                                  <span class="text-[10px] text-slate-400 font-bold uppercase">Format</span>
                                  <p class="font-extrabold text-slate-800 mt-0.5">PDF / Print</p>
                                </div>
                              </div>
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                              <a href="result.html?id=${r.id}" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold rounded-xl shadow-sm transition flex items-center">
                                <i class="fas fa-eye mr-1.5"></i> View Report
                              </a>
                              <a href="result.html?id=${r.id}&download=pdf" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition">
                                <i class="fas fa-download"></i> PDF
                              </a>
                            </div>
                          </div>`;
                    }).join('');
                } else {
                    grid.innerHTML = `
                      <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-slate-200 p-8">
                        <div class="w-16 h-16 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-3 font-bold text-2xl">
                          <i class="fas fa-file-contract"></i>
                        </div>
                        <h3 class="text-lg font-extrabold text-slate-900">No Reports Available Yet</h3>
                        <p class="text-xs text-slate-500 max-w-sm mx-auto mt-1 mb-4">Run an AI analysis to generate exportable crop recommendation dossiers.</p>
                        <a href="recommendation.html" class="inline-flex items-center px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-md transition">
                          <i class="fas fa-wand-magic-sparkles mr-1"></i> Run AI Analysis
                        </a>
                      </div>`;
                }
            } catch (e) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-500 text-sm">Failed to load reports.</div>`;
            }
        }
    </script>
</body>
</html>
