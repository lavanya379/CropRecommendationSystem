<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI | Analysis History</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation Container -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto pt-16 lg:pt-0 lg:pl-72 bg-slate-50 custom-scrollbar">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                
                <!-- Page Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div>
                        <div class="flex items-center space-x-2 text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full w-max mb-2 border border-emerald-200">
                            <i class="fas fa-clock-rotate-left"></i>
                            <span>Historical AI Records</span>
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Analysis History</h1>
                        <p class="text-slate-500 text-sm mt-1">Review prior crop recommendation reports, SHAP explanations, and predictions.</p>
                    </div>

                    <a href="recommendation.html" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-extrabold shadow-md shadow-emerald-200 transition flex items-center">
                        <i class="fas fa-plus mr-2"></i> New Analysis
                    </a>
                </div>

                <!-- Filters & Search Bar -->
                <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Search Crop / Farm</label>
                            <div class="relative">
                                <i class="fas fa-search absolute left-3.5 top-1/2 transform -translate-y-1/2 text-slate-400 text-xs"></i>
                                <input type="text" id="search-input" placeholder="Search by crop name or farm..." class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Filter by Farm</label>
                            <select id="farm-filter" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                <option value="">All Farms</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Filter by Recommended Crop</label>
                            <select id="crop-filter" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                <option value="">All Crops</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- History Table Card -->
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div class="overflow-x-auto rounded-2xl border border-slate-200/80">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-slate-100/80 text-slate-500 font-extrabold uppercase text-[11px] tracking-wider">
                                <tr>
                                    <th class="px-4 py-3.5">Farm</th>
                                    <th class="px-4 py-3.5">Recommended Crop</th>
                                    <th class="px-4 py-3.5">Prediction Score</th>
                                    <th class="px-4 py-3.5">Analysis Date</th>
                                    <th class="px-4 py-3.5">Model Version</th>
                                    <th class="px-4 py-3.5 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody" class="divide-y divide-slate-100 bg-white">
                                <tr>
                                    <td colspan="6" class="px-4 py-8 text-center text-slate-400 text-xs">Loading recommendation history...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Page Scripts -->
    <script src="../js/api.js?v=2.1"></script>
    <script src="../js/nav.js?v=2.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            initCropAINavigation('history');
            if (!getToken()) { window.location.href = '../login.html'; return; }

            let allRecs = [];

            try {
                const res = await RecAPI.getHistory();
                if (res.success && res.recommendations) {
                    allRecs = res.recommendations;
                    populateFilters(allRecs);
                    renderTable(allRecs);
                } else {
                    renderEmpty();
                }
            } catch (e) {
                renderEmpty();
            }

            // Filter Event Listeners
            const searchInput = document.getElementById('search-input');
            const farmFilter  = document.getElementById('farm-filter');
            const cropFilter  = document.getElementById('crop-filter');

            function applyFilters() {
                const search = searchInput.value.toLowerCase().trim();
                const farmVal = farmFilter.value.toLowerCase();
                const cropVal = cropFilter.value.toLowerCase();

                const filtered = allRecs.filter(r => {
                    const matchSearch = (r.recommended_crop || '').toLowerCase().includes(search) || (r.farm_name || '').toLowerCase().includes(search);
                    const matchFarm   = !farmVal || (r.farm_name || '').toLowerCase() === farmVal;
                    const matchCrop   = !cropVal || (r.recommended_crop || '').toLowerCase() === cropVal;
                    return matchSearch && matchFarm && matchCrop;
                });

                renderTable(filtered);
            }

            if (searchInput) searchInput.addEventListener('input', applyFilters);
            if (farmFilter)  farmFilter.addEventListener('change', applyFilters);
            if (cropFilter)  cropFilter.addEventListener('change', applyFilters);

            function populateFilters(recs) {
                const farms = [...new Set(recs.map(r => r.farm_name).filter(Boolean))];
                const crops = [...new Set(recs.map(r => r.recommended_crop).filter(Boolean))];

                if (farmFilter) {
                    farms.forEach(f => {
                        const opt = document.createElement('option');
                        opt.value = f.toLowerCase();
                        opt.textContent = f;
                        farmFilter.appendChild(opt);
                    });
                }

                if (cropFilter) {
                    crops.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.toLowerCase();
                        opt.textContent = c.charAt(0).toUpperCase() + c.slice(1);
                        cropFilter.appendChild(opt);
                    });
                }
            }

            function renderTable(recs) {
                const tbody = document.getElementById('history-tbody');
                if (!tbody) return;

                if (recs.length === 0) {
                    tbody.innerHTML = `
                      <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-slate-400 text-xs">
                          No matching analysis records found.
                        </td>
                      </tr>`;
                    return;
                }

                tbody.innerHTML = recs.map(r => {
                    const conf = parseFloat(r.model_confidence || 0);
                    const score = (conf <= 1 ? (conf * 100).toFixed(1) : conf.toFixed(1)) + '%';
                    const date = new Date(r.created_at).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });

                    return `
                      <tr class="hover:bg-slate-50/80 transition">
                        <td class="px-4 py-3.5 font-bold text-slate-800">${r.farm_name || 'Primary Farm'}</td>
                        <td class="px-4 py-3.5 font-extrabold text-emerald-700 capitalize">
                          <i class="fas fa-seedling text-emerald-500 mr-1.5"></i>${r.recommended_crop}
                        </td>
                        <td class="px-4 py-3.5 font-bold text-slate-900">${score}</td>
                        <td class="px-4 py-3.5 text-slate-500 text-xs">${date}</td>
                        <td class="px-4 py-3.5 text-slate-400 text-xs font-mono">ensemble-v2.0</td>
                        <td class="px-4 py-3.5 text-right">
                          <a href="result.html?id=${r.id}" class="px-3 py-1.5 bg-emerald-50 hover:bg-emerald-100 text-emerald-800 rounded-xl font-bold text-xs transition inline-flex items-center">
                            View Report <i class="fas fa-arrow-right ml-1"></i>
                          </a>
                        </td>
                      </tr>`;
                }).join('');
            }

            function renderEmpty() {
                const tbody = document.getElementById('history-tbody');
                if (tbody) {
                    tbody.innerHTML = `
                      <tr>
                        <td colspan="6" class="px-4 py-8 text-center text-slate-400 text-xs">
                          No recommendations recorded yet. <a href="recommendation.html" class="font-bold text-emerald-700 underline ml-1">Run first analysis</a>
                        </td>
                      </tr>`;
                }
            }
        });
    </script>
</body>
</html>
