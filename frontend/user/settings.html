<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CropAI | Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar Navigation Container -->
        <div id="sidebar-container"></div>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto pt-16 lg:pt-0 lg:pl-72 bg-slate-50 custom-scrollbar">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                
                <!-- Header -->
                <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200/80 shadow-sm">
                    <div class="flex items-center space-x-2 text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-full w-max mb-2 border border-slate-200">
                        <i class="fas fa-sliders"></i>
                        <span>System Preferences</span>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">Account Settings</h1>
                    <p class="text-slate-500 text-sm mt-1">Configure notification alerts, language options, and display preferences.</p>
                </div>

                <div class="bg-white rounded-3xl shadow-sm border border-slate-200/80 p-6 sm:p-8 space-y-6">
                    <div id="settings-alert" class="hidden bg-emerald-50 text-emerald-800 p-4 rounded-2xl text-xs font-bold border border-emerald-200 flex items-center">
                        <i class="fas fa-check-circle mr-2 text-base text-emerald-600"></i> Settings saved successfully!
                    </div>

                    <form id="settings-form" class="space-y-6">
                        
                        <!-- Notification Preferences -->
                        <div>
                            <h3 class="text-sm font-extrabold text-slate-900 mb-3 border-b pb-2">Notification Preferences</h3>
                            <div class="space-y-3">
                                <label class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100 cursor-pointer">
                                    <div>
                                        <span class="text-xs font-bold text-slate-800 block">Weather & Rainfall Alerts</span>
                                        <span class="text-[11px] text-slate-400">Receive alerts for severe precipitation changes</span>
                                    </div>
                                    <input type="checkbox" checked class="w-4 h-4 accent-emerald-600 rounded">
                                </label>

                                <label class="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100 cursor-pointer">
                                    <div>
                                        <span class="text-xs font-bold text-slate-800 block">Mandi Commodity Price Updates</span>
                                        <span class="text-[11px] text-slate-400">Get weekly updates on Agmarknet price trends</span>
                                    </div>
                                    <input type="checkbox" checked class="w-4 h-4 accent-emerald-600 rounded">
                                </label>
                            </div>
                        </div>

                        <!-- Language & Display -->
                        <div>
                            <h3 class="text-sm font-extrabold text-slate-900 mb-3 border-b pb-2">Language & Display</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Platform Language</label>
                                    <select class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                        <option value="en">English</option>
                                        <option value="te">Telugu (తెలుగు)</option>
                                        <option value="hi">Hindi (हिंदी)</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-slate-700 mb-1">Theme Mode</label>
                                    <select class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold focus:ring-2 focus:ring-emerald-500 outline-none">
                                        <option value="light">Light Green Theme (Default)</option>
                                        <option value="system">System Preference</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex justify-end">
                            <button type="submit" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-xl shadow-md transition">
                                Save Preferences
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <!-- Page Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initCropAINavigation('settings');
            if (!getToken()) { window.location.href = '../login.html'; return; }

            document.getElementById('settings-form')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const alertBox = document.getElementById('settings-alert');
                alertBox.classList.remove('hidden');
                setTimeout(() => alertBox.classList.add('hidden'), 3000);
            });
        });
    </script>
</body>
</html>
